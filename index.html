<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="MARVEL ONLINE 2.0">
    <meta name="author" content="furtibu">
    <title>MARVEL ONLINE 2.1</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">

	<script src="js/jquery-3.7.1.min.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>

    <style>
        #minput, #accordion2, #badeners, #handlingerrors, #downloadsec, #energies, #transitions, #result {
            display: none;
        }
        .dontshow {
            display: none;
        }
        .sortable {
            cursor: pointer;
            user-select: none;
        }
        .sortable:hover {
            background-color: #e9ecef;
        }
    </style>
</head>
<body class="bg-light p-4">

    <div class="container-fluid">
        <h1 class="mb-4">MARVEL 2.1</h1>

        <div class="row g-5">
            
            <!-- BAL OLDAL: Inputs (col-md-4) -->
			<div class="col-md-4">
				<div class="card border-primary shadow-sm">
					
					<!-- Fejléc -->
					<div class="panel-heading p-3 d-flex justify-content-between align-items-center" style="background-color: #337ab7; color: white; margin-bottom: 25px;">
						<span class="fw-bold fs-5">Inputs</span>
						<button type="button" class="btn btn-xs btn-default" onclick="window.location.reload();" style="margin-left: 255px; color: #333; font-weight: normal; background-color: #fff; border-color: #ccc;">
							Reload page
						</button>
					</div>
					
					<div class="card-body p-3">
						<!-- NQN és UNC Mezők -->
						<div style="display: flex; align-items: center; gap: 20px; margin-bottom: 15px;">
    
							<!-- NQN blokk -->
							<div style="display: flex; align-items: center; gap: 8px;">
								<label for="quantum" style="font-weight: bold; margin: 0; font-family: sans-serif;">NQN:</label>
								<input type="number" id="quantum" value="6" style="width: 70px; height: 32px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px;">
							</div>

							<!-- UNC blokk -->
							<div style="display: flex; align-items: center; gap: 8px;">
								<label for="unc_val" style="font-weight: bold; margin: 0; font-family: sans-serif;">UNC:</label>
								<select id="unc_val" style="width: 70px; height: 32px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; background-color: #fff; font-size: 14px;">
									<option value="2" selected>2</option>
									<option value="1">1</option>
								</select>
							</div>

						</div>

						<!-- Fájlválasztók -->
						<div class="my-3">
							<div class="mb-3">
								<label class="form-label fw-bold d-block mb-1">Select your MARVEL energy file:</label>
								<input type="file" class="form-control ener" accept="text/plain" style="margin-bottom: 25px;">
							</div>

							<div class="mb-3" id="file-container">
								<label class="form-label fw-bold d-block mb-1">Select your MARVEL transitions file:</label>
								<input type="file" name="trans[]" class="form-control multifile" accept="text/plain" style="margin-bottom: 25px;">
							</div>

							<!-- SEGMENTS FÁJL -->
							<div class="mb-3">
								<label class="form-label fw-bold d-block mb-1">Select MARVEL segments file (optional):</label>
								<input type="file" id="segfile" class="form-control" accept="text/plain" style="margin-bottom: 25px;">
							</div>
						</div>

						<!-- Indító gomb -->
						<div class="mt-4 pt-2 d-flex justify-content-end">
							<button type="button" id="runCD" class="btn btn-success btn-lg fw-bold" style="margin-left: 105px; margin-bottom: 25px;">Run CD Test</button>
						</div>

						<!-- LOG PANEL -->
						<div class="mt-4">
							<label class="form-label fw-bold fs-6">Process Log:</label>
							<div id="log-output" class="p-3 bg-dark text-success font-monospace rounded shadow-sm" style="height: 220px; overflow-y: scroll; font-size: 1.3rem; line-height: 1.5; border: 1px solid #444;">
								<em>Waiting to start...</em>
							</div>
						</div>

					</div>
				</div>
			</div>

            <!-- Download Panel -->
            <div class="col-md-8 dontshow">
                <div class="mb-4">
					<h3 class="h4 fw-bold text-dark mb-2" id="restext">Download new transitions</h3>
					<div id="downfile"></div>
				</div>
            </div>

            <!-- Details Panel (Most már a Results előtt található) -->
            <div class="col-md-8 dontshow">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-secondary text-white">
                        <h4 class="card-title mb-0">Details:</h4>
                    </div>
                    <div class="card-body">
                        <div id="detail"></div>
                    </div>
                </div>
            </div>

            <!-- Results Panel (Táblázat) -->
            <div class="col-md-8 dontshow">
                <div class="mt-2">
				<h3 class="h4 fw-bold text-dark mb-3">Results:</h3>
					<div class="card-body">
                        <div id="result" class="table-responsive"></div>
                    </div>
                </div>
            </div>

        </div><!-- /row -->

    </div><!-- /container -->
	
<script src="cd_core.js"></script>
   
</body>
</html>
